            <main>
            <h1>Vols col·laborar amb nosaltres?</h1>
                <form action="que_en_penses.html" method="get">
                    <fieldset>
                        <legend>Informació personal</legend>

                        <label for="nom">Nom</label>
                        <input id="nom" name="nom" type="text" placeholder="Escriu el teu nom" required>
                        
                        <label for="apellidos">Cognoms</label>
                        <input id="cognoms" name="cognoms" type="text" placeholder="Escriu els teus cognoms" required>
                            
                        <label for="email">Email</label>
                        <input id="email" name="email" type="text" placeholder="exemple@exemple.com" required>
                            
                        <label for="telefono">Telèfon</label>
                        <input id="telefon" name="telefon" type="tel" placeholder="123 456 789" required>
                            
                        <label for="tipus">Tipus de col·laboració:</label>
                        <select name="opcions" id="opcions">
                            <option value="musica">Música (cantant, productor, DJ...)</option>
                            <option value="altres">Altres (fotografia, vídeo, disseny...)</option>    
                        </select>
                            
                        <p>Quins rols t'interessen?</p>
                        <input type="checkbox" id="cantant" name="rols" value="cantant" checked>
                        <label for="cantant">Cantant</label>
                        <input type="checkbox" id="productor" name="rols" value="productor">
                        <label for="productor">Productor</label>
                        <input type="checkbox" id="disseny" name="rols" value="disseny">
                        <label for="disseny">Dissenyador/a</label>
        
                        <p>Com prefereixes que et contactem?</p>
                        <input type="radio" id="radio-email" name="contacte" value="email" checked>
                        <label for="radio-email">Correu electrònic</label>
                        <input type="radio" id="radio-telefon" name="contacte" value="telefon">
                        <label for="radio-telefon">Telèfon</label>
                        <input type="radio" id="radio-xarxes" name="contacte" value="xarxes">
                        <label for="radio-xarxes">Xarxes socials</label>
                        
                        <label for="missatge">Missatge</label>
                        <textarea id="missatge" name="missatge" placeholder="Explica’ns la teva proposta o idea de col·laboració..."></textarea>
                    
                        <button type="submit">Enviar</button></fieldset>
                </form>
            </main>
